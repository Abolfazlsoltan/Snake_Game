name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Set up Node.js for game validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate game JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline game script, found {len(scripts)}")
          Path("/tmp/snake-arena-game.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/snake-arena-game.js

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Gradle project
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SnakeArena-debug.apk
          sha256sum artifacts/SnakeArena-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArena-debug-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
